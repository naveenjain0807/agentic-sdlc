server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  forward-headers-strategy: framework

spring:
  application:
    name: url-shortener-service

  # ---------------------------------------------------------------
  # H2 in-memory. DB_CLOSE_DELAY=-1 keeps the database alive for the
  # lifetime of the JVM even when no connection is open.
  # Swap SPRING_DATASOURCE_URL for a file or Postgres URL without any
  # code change - the Flyway migrations are the contract.
  # ---------------------------------------------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: url-shortener-pool
      maximum-pool-size: 10

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never touch it.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: list
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,flyway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: url-shortener-service

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  max-url-length: 2048
  default-ttl-seconds: 0
  recent-click-limit: 20

logging:
  level:
    root: INFO
    com.agentic.urlshortener: INFO
    org.flywaydb: INFO
